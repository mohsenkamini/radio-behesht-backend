jobs:
  darkube_build_test_mohsenkamini_hamravesh-c11:
    container:
      image: hamravesh/darkube-cli:v1.1
      options: --user root
    env:
      IMAGE_NAME: nginx
      DOCKER_AUTH_CONFIG: ${{ secrets.DOCKER_AUTH_CONFIG }}
    runs-on: ubuntu-latest
    steps:
    - name: checkout commit
      uses: actions/checkout@v4
    #- name: darkube-cli build & push
    #  run: darkube build --push -t "$IMAGE_NAME:${GITHUB_SHA:0:7}" -t "$IMAGE_NAME:$GITHUB_REF_NAME" --docker-auth-config "$DOCKER_AUTH_CONFIG" --workdir . --file ./Dockerfile --build-context .
  darkube_deploy_test_mohsenkamini_hamravesh-c11:
    container: hamravesh/darkube-cli:v1.1
    needs: darkube_build_test_mohsenkamini_hamravesh-c11
    runs-on: ubuntu-latest
    steps:
    - name: darkube-cli deploy
      run: darkube deploy --token ${{secrets.DEPLOY_TOKEN_TEST_MOHSENKAMINI_HAMRAVESH_C11}}
        --app-id ${{secrets.APP_ID_TEST_MOHSENKAMINI_HAMRAVESH_C11}} --image-tag ${GITHUB_SHA:0:7}
        --job-id ${GITHUB_RUN_ID}
  darkube_network_diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TARGET_HOST: api.console.hamravesh.ir

    steps:
      - name: Install diagnostic tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mtr-tiny dnsutils curl

      - name: Collect network diagnostics
        shell: bash
        run: |
          mkdir -p diagnostics
          set +e

          probe() {
            local name="$1"
            shift
            {
              echo "=== $name ==="
              date -u '+%Y-%m-%dT%H:%M:%SZ'
              "$@"
              rc=$?
              echo
              echo "exit_code=$rc"
            } 2>&1 | tee "diagnostics/$name.txt"
          }

          {
            date -u '+%Y-%m-%dT%H:%M:%SZ'
            echo "run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "runner_name=$RUNNER_NAME"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            uname -a
            cat /etc/os-release
            curl -V
            openssl version
            ip -brief address
            ip route
            ip -6 route
            cat /etc/resolv.conf
          } 2>&1 | tee diagnostics/runner.txt

          probe public-ipv4 curl -4 -fsS \
            --connect-timeout 5 --max-time 15 https://api.ipify.org

          probe public-ipv6 curl -6 -fsS \
            --connect-timeout 5 --max-time 15 https://api6.ipify.org

          probe dns-a dig +time=3 +tries=1 "$TARGET_HOST" A
          probe dns-aaaa dig +time=3 +tries=1 "$TARGET_HOST" AAAA

          CURL_ARGS=(
            --verbose
            --trace-time
            --http1.1
            --connect-timeout 5
            --max-time 20
            --output /dev/null
            --write-out '\nremote_ip=%{remote_ip} local_ip=%{local_ip} http_code=%{http_code} dns=%{time_namelookup} tcp=%{time_connect} tls=%{time_appconnect} first_byte=%{time_starttransfer} total=%{time_total}\n'
          )

          probe curl-default curl \
            "${CURL_ARGS[@]}" "https://$TARGET_HOST/"

          probe curl-ipv4-tls12 curl -4 \
            "${CURL_ARGS[@]}" --tlsv1.2 --tls-max 1.2 \
            "https://$TARGET_HOST/"

          probe curl-ipv4-tls13 curl -4 \
            "${CURL_ARGS[@]}" --tlsv1.3 --tls-max 1.3 \
            "https://$TARGET_HOST/"

          # Probe each IPv4 destination while preserving hostname and TLS SNI.
          mapfile -t TARGET_IPS < <(
            dig +short +time=3 +tries=1 "$TARGET_HOST" A |
              awk '/^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$/' |
              sort -u
          )

          for ip in "${TARGET_IPS[@]}"; do
            probe "curl-ip-$ip" curl -4 \
              "${CURL_ARGS[@]}" \
              --resolve "$TARGET_HOST:443:$ip" \
              "https://$TARGET_HOST/"

            probe "mtr-tcp-$ip" sudo timeout 60s \
              mtr -4 --tcp --port 443 \
              --report --report-wide --no-dns \
              --report-cycles 20 "$ip"
          done

          exit 0

      - name: Test Requests inside the Darkube image
        shell: bash
        run: |
          mkdir -p diagnostics
          set +e
          docker run --rm -i \
            --entrypoint sh \
            -e TARGET_HOST \
            hamravesh/darkube-cli:v1.1 \
            -c '
              if [ -x /app/venv/bin/python ]; then
                exec /app/venv/bin/python -
              elif command -v python3 >/dev/null 2>&1; then
                exec python3 -
              else
                exec python -
              fi
            ' <<'PY' 2>&1 | tee diagnostics/darkube-python.txt
          import datetime
          import os
          import socket
          import ssl
          import sys
          import traceback
          import requests

          host = os.environ["TARGET_HOST"]
          print("utc:", datetime.datetime.now(datetime.timezone.utc).isoformat(), flush=True)
          print("python:", sys.version, flush=True)
          print("openssl:", ssl.OPENSSL_VERSION, flush=True)
          print("requests:", requests.__version__, flush=True)

          try:
              addresses = sorted({
                  item[4][0]
                  for item in socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)
              })
              print("resolved_ips:", addresses, flush=True)
          except Exception:
              traceback.print_exc()

          for label, url in [
              ("public_ipv4", "https://api.ipify.org"),
              ("target", f"https://{host}/"),
          ]:
              print(f"\n=== {label}: {url} ===", flush=True)
              try:
                  response = requests.get(
                      url, timeout=(5, 15), allow_redirects=False
                  )
                  print("status:", response.status_code, flush=True)
                  if label == "public_ipv4":
                      print("source_ip:", response.text.strip(), flush=True)
              except Exception:
                  traceback.print_exc()
          PY
          echo "docker_exit_code=${PIPESTATUS[0]}" | tee -a diagnostics/darkube-python.txt
          exit 0

      - name: Upload diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darkube-network-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostics/
          retention-days: 7
          if-no-files-found: warn
'on':
  push:
    branches:
    - main
